version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nova_dev
      POSTGRES_PASSWORD: nova_password
      POSTGRES_DB: nova_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_dev -d nova_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://nova_dev:nova_password@db:5432/nova_crm
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: nova_dev
      PGPASSWORD: nova_password
      PGDATABASE: nova_crm
    volumes:
      - ./scripts/backup.sh:/backup.sh
      - ./backups:/mnt/backup
    entrypoint: ["/bin/sh", "-c", "echo '0 2 * * * /backup.sh' > /etc/crontabs/root && crond -f -l 2"]

volumes:
  pgdata:
